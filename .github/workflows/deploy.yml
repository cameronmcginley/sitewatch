name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Website
        env:
          HOST: ${{ secrets.VPS_IP }}
          USERNAME: ${{ secrets.VPS_USERNAME }}
          PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
        run: |
          ssh -i "$PRIVATE_KEY" "$USERNAME@$HOST" << 'EOF'
          set -e
          cd ~ || exit
          ./droplet_setup.sh
          EOF
